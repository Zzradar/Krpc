# Local bench: no ZooKeeper (client uses LB_STATIC_ENDPOINTS=127.0.0.1:8000)
rpcserverip=127.0.0.1
rpcserverport=8000
zookeeperip=127.0.0.1
zookeeperport=2181
skip_zookeeper_registration=1
rpc_codec=msgpack
metrics_http_enabled=0
metrics_http_port=9100
heartbeat_interval_ms=1000
heartbeat_miss_limit=3
rpc_timeout_ms=5000
provider_worker_threads=8
provider_queue_capacity=2048
enable_connection_pool=1
connection_pool_max_idle=4
lb_fail_cooldown_ms=3000
log_minlevel=2
logtostderr=1
